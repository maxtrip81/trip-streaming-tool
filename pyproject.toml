[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-streaming-tool"
version = "1.0.0"
description = "TRIP streaming tool - free, lightweight live audio streaming to Icecast, SHOUTcast and WebRTC/WHIP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Massimiliano Mascioli Trippa (Max Trip)" }]
requires-python = ">=3.9"
dependencies = [
    "PySide6-Essentials>=6.5",
    "numpy>=1.22",
    "scipy>=1.8",
    "sounddevice>=0.4.6",
    "imageio-ffmpeg>=0.4.9",
    "aiortc>=1.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6", "pillow"]

[project.scripts]
trip-streaming-tool = "trip_stream.app:main"

[tool.setuptools.packages.find]
include = ["trip_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
