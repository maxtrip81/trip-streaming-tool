name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 ffmpeg libegl1 libxkbcommon0
      - run: pip install -r requirements.txt pytest pytest-timeout
      - run: pytest -q -rfE --timeout=90 --junitxml=pytest.xml
      - if: failure()
        run: python tools/ci_annotate.py pytest.xml

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pyinstaller --noconfirm trip.spec
      # the built program must really stream-record to disk on every platform before it is shipped
      - name: Recording smoke test (built program)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/trip-streaming-tool/trip-streaming-tool.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then EXE="dist/TRIP streaming tool.app/Contents/MacOS/trip-streaming-tool"
          else EXE=dist/trip-streaming-tool/trip-streaming-tool; fi
          python tools/smoke_frozen.py "$EXE"
      - name: Windows installer
        if: runner.os == 'Windows'
        run: iscc installer\windows\trip.iss
        shell: cmd
      - name: macOS disk image and package
        if: runner.os == 'macOS'
        run: |
          echo "::notice title=macOS $(uname -m) minimum version::$(tools/macos_minos.sh "dist/TRIP streaming tool.app")"
          installer/macos/build_dmg.sh && installer/macos/build_pkg.sh
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: installer/linux/build_tarball.sh
      - uses: actions/upload-artifact@v5
        with:
          name: trip-streaming-tool-${{ runner.os }}
          path: |
            installer/windows/Output/*.exe
            dist/*.dmg
            dist/*.pkg
            dist/*.tar.gz

  # Publishes the release (only when every platform passed): for tags v*, and from main for the version in
  # trip_stream/__init__.py (the tag is created by the release action when it does not exist yet).
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: echo "tag=v$(python3 -c 'import trip_stream; print(trip_stream.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: TRIP streaming tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*

  # Native Apple Silicon (arm64) build. GitHub's arm64 macOS runners are often short of capacity, so this job
  # runs after the release is published and adds its files to it; if it is not picked up, re-run just this job.
  package-macos-apple-silicon:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller --noconfirm trip.spec
      - name: Check native arm64 build
        run: |
          file "dist/TRIP streaming tool.app/Contents/MacOS/trip-streaming-tool" | tee /dev/stderr | grep -q arm64
          echo "::notice title=macOS $(uname -m) minimum version::$(tools/macos_minos.sh "dist/TRIP streaming tool.app")"
      - name: Recording smoke test (built program)
        run: python tools/smoke_frozen.py "dist/TRIP streaming tool.app/Contents/MacOS/trip-streaming-tool"
      - run: installer/macos/build_dmg.sh && installer/macos/build_pkg.sh
      - name: Version
        id: version
        run: echo "tag=v$(python3 -c 'import trip_stream; print(trip_stream.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: trip-streaming-tool-macOS-apple-silicon
          path: |
            dist/*.dmg
            dist/*.pkg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: TRIP streaming tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.dmg
            dist/*.pkg
