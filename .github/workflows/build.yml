name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 ffmpeg libegl1 libxkbcommon0
      - run: pip install -r requirements.txt pytest
      - run: QT_QPA_PLATFORM=offscreen pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pyinstaller --noconfirm trip.spec
      - name: Windows installer
        if: runner.os == 'Windows'
        run: iscc installer\windows\trip.iss
        shell: cmd
      - name: macOS disk image and package
        if: runner.os == 'macOS'
        run: installer/macos/build_dmg.sh && installer/macos/build_pkg.sh
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: installer/linux/build_tarball.sh
      - uses: actions/upload-artifact@v5
        with:
          name: trip-streaming-tool-${{ runner.os }}
          path: |
            installer/windows/Output/*.exe
            dist/*.dmg
            dist/*.pkg
            dist/*.tar.gz
      - name: Version
        id: version
        shell: bash
        run: echo "tag=v$(python -c 'import trip_stream; print(trip_stream.__version__)')" >> "$GITHUB_OUTPUT"
      # Publishes the release for tags v*, and from main for the version in trip_stream/__init__.py
      # (the tag is created by the release action when it does not exist yet).
      - if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: TRIP streaming tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            installer/windows/Output/*.exe
            dist/*.dmg
            dist/*.pkg
            dist/*.tar.gz
